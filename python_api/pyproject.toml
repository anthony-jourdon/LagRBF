[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lagrbfpy"
version = "1.0.0"
description = "Lagrangian Radial Basis Function interpolation and advection library with Python API"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    {name = "Anthony Jourdon", email = "jourdon@geoazur.unice.fr"}
]
keywords = ["rbf", "radial-basis-function", "interpolation", "advection", "lagrangian", "geodynamics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.0",
    "pyvista>=0.37",
]

[project.optional-dependencies]
# petsc4py must be installed from your PETSc build:
#   pip install $PETSC_DIR/src/binding/petsc4py
# It is intentionally NOT auto-installed to respect per-machine PETSc configurations
analytical = ["sphericart>=0.1.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "sphinx>=4.5",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=5.0",
]
all = [
    "sphericart>=0.1.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "sphinx>=4.5",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=5.0",
]

[project.urls]
"Homepage" = "https://github.com/anthony-jourdon/LagRBF"
"Documentation" = "https://github.com/anthony-jourdon/LagRBF/docs"
"Bug Tracker" = "https://github.com/anthony-jourdon/LagRBF/issues"
"Source Code" = "https://github.com/anthony-jourdon/LagRBF"

[tool.setuptools]
packages = ["lagrbfpy"]

[tool.setuptools.package-data]
lagrbfpy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["python_api/tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py312', 'py313']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
